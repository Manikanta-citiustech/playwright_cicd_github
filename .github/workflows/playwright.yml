name: Playwright CICD for Regression Testing in QA and Smoke Testing in Main

on:
  pull_request:
    branches:
      - main
      - qa
  
  schedule:
    - cron: '30 4 * * 1-5' 
      # Runs every day at 10 AM IST (4:30 AM UTC) from Monday to Friday   

jobs:
  playwright_test:
    name: Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30


    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install playwright browsers
      run: npx playwright install --with-deps
      #--with-deps ensures: Chromium launches successfully  
     
    # Regression test for QA branch
    - name: Run Regression Tests
      if: github.event.pull_request.base.ref == 'qa' || github.event_name == 'schedule'
      run: npm run regression
      
    # Smoke test for Main branch
    - name: Run Smoke Tests
      if: github.event.pull_request.base.ref == 'main'
      run: npm run smoke
   
    - name: upload Allure Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-results
        path: allure-results/
        retention-days: 1
  
  allure_report:
    name: Generate Allure Report
    needs: playwright_test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Allure Results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results/ 

      - name: setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install Allure Commandline
        run: npm install -g allure-commandline

      - name: Generate Allure Report
        run: allure generate allure-results --clean -o allure-report  
    
          
          