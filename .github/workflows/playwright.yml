name: Playwright CICD for Regression Testing in QA and Smoke Testing in Main

on:
  workflow_dispatch:   #manual trigger (Run workflow button)
  
  pull_request:
    branches:
      - main
      - qa
  
  schedule:
    - cron: '30 4 * * 1-5' 

jobs:
  playwright_test:
    name: Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30


    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install playwright browsers
      run: npx playwright install --with-deps
      #--with-deps ensures: Chromium launches successfully  
     
    # Regression test for QA branch
    - name: Run Regression Tests
      if: > 
            github.event_name == 'schedule' ||
            github.event_name == 'workflow_dispatch' ||
            ( github.event_name == 'pull_request' && 
              github.event.pull_request.base.ref == 'qa') 
      run: npm run regression
      
    # Smoke test for Main branch
    - name: Run Smoke Tests
      if: github.event_name == 'pull_request' && 
          github.event.pull_request.base.ref == 'main'
      run: npm run smoke
   
    - name: upload Allure Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-results
        path: allure-results/
        retention-days: 1
  
  allure_report:
    name: Generate Allure Report
    needs: playwright_test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Allure Results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results/ 

      - name: setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install Allure Commandline
        run: npm install -g allure-commandline

      - name: Generate Allure Report
        run: allure generate allure-results --clean -o allure-report

      - name: Upload Allure HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 2

      - name: Generate Zip of Allure Report
        run: zip -r allure-report.zip allure-report
      
      - name: Send Allure Report via Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.EMAIL_SERVER }}
          server_port: 587
          secure: false

          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}

          subject: "Playwright Allure Test Report - ${{ github.workflow }} - ${{ github.run_number }}"
          to: ${{ secrets.EMAIL_TO }}
          from: ${{ secrets.EMAIL_FROM }}
          #attachments: allure-report.zip  
          body: |
               Hi Team, 
               
               Playwright test execution is complete.

               Allure Report: 
               https://manikanta-citiustech.github.io/playwright_cicd_github

                Thanks, 
                Playwright CICD Bot

  deploy_allure_report:
    name: Publish Allure Report to GitHub Pages
    needs: allure_report
    runs-on: ubuntu-latest

    steps:
    - name: Download Allure HTML Report
      uses: actions/download-artifact@v4
      with:
        name: allure-report
        path: allure-report

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: allure-report
   
          
          
