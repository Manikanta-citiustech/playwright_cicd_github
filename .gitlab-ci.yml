stages:
  - test
  - report

playwright_test:
  stage: test
  image: mcr.microsoft.com/playwright:v1.59.1-jammy
  timeout: 30 minutes

  rules:
      # QA branch -> regression test
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" &&
              $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "qa"'
      variables:
        TEST_COMMAND: "regression"

      # Main branch  -> smoke test
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && 
              $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'   
      variables:
        TEST_COMMAND: "smoke"

      #schedule -> regression test       
    #- if: '$CI_PIPELINE_SOURCE == "schedule"'

    #- if: '$CI_PIPELINE_SOURCE == "web"'

  script:
    - npm ci
    - npm run $TEST_COMMAND

  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - allure-results/ 

allure_report:
  stage: report
  image: eclipse-temurin:17-jdk
  needs:
    - playwright_test

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    #- if: '$CI_PIPELINE_SOURCE == "schedule"'
    #- if: '$CI_PIPELINE_SOURCE == "web"'

  script:
    - apt-get update && apt-get install -y nodejs npm
    - npm install -g allure-commandline
    - allure generate allure-results --clean -o allure-report

  artifacts:
    when: always
    paths:
      - allure-report/
    expire_in: 1 day      